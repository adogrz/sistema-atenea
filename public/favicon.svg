    <style>
        /* Definición de colores dinámicos */
        :root {
        /* Color azul para tema claro */
        --dynamic-blue-color: #055795;
        }

        /* Regla para tema oscuro */
        @media (prefers-color-scheme: dark) {
        :root {
        /* Para tema oscuro, el azul dinámico es un tono más claro */
        --dynamic-blue-color: #64b5f6; /* Un azul más claro para contrastar en fondos oscuros */
        }
        }

        /* Aplica el color azul dinámico a los paths dentro de .logo-e */
        .logo-e path {
        fill: var(--dynamic-blue-color);
        }
    </style>
