services:
  app:
    # Este servicio ahora es solo PHP-FPM, no incluye servidor web.
    # El Dockerfile que te di se encarga de esto.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atenea-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    # La aplicación no necesita exponer puertos al exterior;
    # NGINX se encargará de ello.
    depends_on:
      migrator:
        condition: service_completed_successfully
    env_file:
      - .env.docker
    networks:
      - traefik-proxy
    healthcheck:
      # El healthcheck ahora es sobre el proceso php-fpm, no sobre un puerto HTTP.
      test: ['CMD-SHELL', 'pgrep php-fpm']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    # Este es el nuevo servicio de NGINX.
    image: nginx:1.23-alpine
    container_name: atenea-web
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - traefik-proxy
    labels:
      # Estas etiquetas le dicen a Traefik cómo enrutar el tráfico.
      - "traefik.enable=true"
      - "traefik.http.routers.atenea-web.rule=Host(`atenea-dev.example.com`)" # Reemplaza con tu dominio
      - "traefik.http.routers.atenea-web.entrypoints=web"
      - "traefik.http.services.atenea-web.loadbalancer.server.port=80"

  db:
    image: postgres:15-alpine
    container_name: atenea-db
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - atenea-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - traefik-proxy

  migrator:
    # El migrador es un servicio de "una sola vez" que se ejecuta primero.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atenea-migrator
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    command: ["php", "artisan", "migrate", "--force"]
    networks:
      - traefik-proxy
    # No queremos que se reinicie, solo que complete su trabajo.
    restart: "no"

volumes:
  atenea-db-data:
    driver: local

networks:
  traefik-proxy:
    # Usa la red externa de Traefik para que los servicios sean detectables.
    external: true