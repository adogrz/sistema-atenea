services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atenea-app
    restart: unless-stopped
    ports:
      - '8000:8000'
    depends_on:
      configurator:
        condition: service_completed_successfully
    
    networks:
      - atenea-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/up']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:15-alpine
    container_name: atenea-db
    restart: unless-stopped
    
    volumes:
      - atenea-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - atenea-net

  configurator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atenea-configurator
    depends_on:
      db:
        condition: service_healthy
    
    command:
      - /bin/sh
      - -c
      - |
        php artisan config:clear
        php artisan route:clear
        php artisan view:clear
        php artisan config:cache
        php artisan route:cache
        php artisan view:cache
        php artisan migrate --force
    networks:
      - atenea-net

volumes:
  atenea-db-data:
    driver: local

networks:
  atenea-net:
    driver: bridge