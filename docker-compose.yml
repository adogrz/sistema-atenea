services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atenea-app
    restart: unless-stopped
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    networks:
      - atenea-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/up']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:15-alpine
    container_name: atenea-db
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - atenea-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - atenea-net

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atenea-migrator
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    command: ["php", "artisan", "migrate", "--force"]
    networks:
      - atenea-net

volumes:
  atenea-db-data:
    driver: local

networks:
  atenea-net:
    driver: bridge