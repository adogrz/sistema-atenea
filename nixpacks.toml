# Configuración de Nixpacks para Laravel + React 19 + Inertia.js

[phases.setup]
# Asegurar que se instalen TODOS los paquetes necesarios
nixPkgs = [
    # PHP y extensiones (PHP 8.3)
    "php83",
    "php83Extensions.curl",
    "php83Extensions.mbstring",
    "php83Extensions.xml",
    "php83Extensions.pdo",
    "php83Extensions.pdo_mysql",
    "php83Extensions.bcmath",
    "php83Extensions.gd",
    "php83Extensions.zip",
    "php83Extensions.opcache",
    "php83Packages.composer",

    # Node.js y npm (CRÍTICO - esto faltaba)
    "nodejs_20",
    "nodePackages.npm",

    # Nginx y Supervisor
    "nginx",
    "python311Packages.supervisor",

    # Utilidades del sistema
    "bash",
    "coreutils",
]

[phases.install]
# Instalar dependencias de PHP y Node.js
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm ci --production=false",
]

[phases.build]
# Construir assets y preparar la aplicación
cmds = [
    # Construir assets con Vite
    "npm run build",

    # Crear directorios necesarios
    "mkdir -p /etc/supervisor/conf.d/",
    "mkdir -p /etc/nginx/",
    "mkdir -p /var/log/nginx",
    "mkdir -p /var/cache/nginx",
    "mkdir -p /app/storage/logs",
    "mkdir -p /app/storage/framework/{cache,sessions,views}",
    "mkdir -p /app/bootstrap/cache",

    # Copiar archivos de configuración
    "cp /assets/worker-*.conf /etc/supervisor/conf.d/",
    "cp /assets/supervisord.conf /etc/supervisord.conf",
    "chmod +x /assets/start.sh",

    # Optimizar Laravel para producción
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache",

    # Establecer permisos
    "chown -R www-data:www-data /app/storage /app/bootstrap/cache",
    "chmod -R 775 /app/storage /app/bootstrap/cache",
]

[start]
cmd = "/assets/start.sh"

# Variables de entorno importantes
[variables]
NIXPACKS_NODE_VERSION = "20"
PHP_VERSION = "8.3"

# Archivos estáticos necesarios
[staticAssets]

"start.sh" = '''#!/bin/bash
set -euo pipefail

echo "🔧 Configurando aplicación Laravel + React 19..."

# Verificar que Node.js esté instalado
if ! command -v node &> /dev/null; then
    echo "❌ Node.js no encontrado!"
    exit 1
fi

echo "✅ Node.js $(node --version) detectado"

# Configurar permisos Laravel
chmod -R 755 /app/storage /app/bootstrap/cache
chown -R www-data:www-data /app/storage /app/bootstrap/cache

# Procesar plantilla Nginx
node /assets/prestart.mjs /assets/nginx.template.conf /etc/nginx/nginx.conf

# Verificar configuración
nginx -t -c /etc/nginx/nginx.conf

# Limpiar y regenerar cachés de Laravel
php artisan config:clear
php artisan config:cache
php artisan route:cache
php artisan view:cache

# Ejecutar migraciones si es necesario (opcional)
# php artisan migrate --force

echo "🚀 Iniciando aplicación Laravel con React 19 e Inertia.js..."
exec supervisord -c /etc/supervisord.conf -n
'''

"prestart.mjs" = '''import { readFileSync, writeFileSync, mkdirSync } from 'fs';
import { dirname } from 'path';

const [templatePath, outputPath] = process.argv.slice(2);

if (!templatePath || !outputPath) {
  console.error('❌ Usage: node prestart.mjs <template_path> <output_path>');
  process.exit(1);
}

try {
  mkdirSync(dirname(outputPath), { recursive: true });

  const template = readFileSync(templatePath, 'utf8');
  const newContent = template.replace(/\$\{(\w+)\}/g, (match, varName) => {
    const value = process.env[varName];
    if (!value && ['PORT'].includes(varName)) {
      console.warn(`⚠️  Variable requerida ${varName} no está configurada`);
    }
    return value || match;
  });

  writeFileSync(outputPath, newContent);
  console.log(`✅ Configuración Nginx generada en ${outputPath}`);
} catch (error) {
  console.error(`❌ Error: ${error.message}`);
  process.exit(1);
}
'''

"supervisord.conf" = '''[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=true
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
'''

"worker-nginx.conf" = '''[program:nginx]
command=nginx -c /etc/nginx/nginx.conf -g 'daemon off;'
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
'''

"worker-phpfpm.conf" = '''[program:php-fpm]
command=php-fpm -y /assets/php-fpm.conf -F
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
'''

"worker-laravel.conf" = '''[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --memory=512
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
priority=30
startsecs=1
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
'''

"php-fpm.conf" = '''[global]
error_log = /proc/self/fd/2
daemonize = no
log_level = warning

[www]
listen = 127.0.0.1:9000
user = www-data
group = www-data
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 20
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 1000
pm.process_idle_timeout = 10s

clear_env = no
catch_workers_output = yes

php_admin_value[error_reporting] = E_ALL & ~E_DEPRECATED & ~E_STRICT
php_admin_value[display_errors] = Off
php_admin_value[log_errors] = On

php_admin_value[post_max_size] = 50M
php_admin_value[upload_max_filesize] = 50M
php_admin_value[max_execution_time] = 300
php_admin_value[memory_limit] = 512M

php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 128
php_admin_value[opcache.max_accelerated_files] = 10000
php_admin_value[opcache.revalidate_freq] = 60
php_admin_value[opcache.validate_timestamps] = 0
'''

"nginx.template.conf" = '''user www-data;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /dev/stdout main;

    # Optimizaciones de rendimiento
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Compresión optimizada para React 19 + Vite 6
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/js
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        application/xml
        image/svg+xml
        application/wasm;

    # Límites optimizados
    client_max_body_size 50M;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    server {
        listen ${PORT} default_server;
        listen [::]:${PORT} default_server;
        server_name _;

        root /app/public;
        index index.php index.html;

        # Headers de seguridad para React 19
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Assets de Vite 6 optimizados
        location ~* ^/(build|assets)/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
            access_log off;

            # Soporte para ES modules y dynamic imports
            location ~* \.(m?js|ts)$ {
                add_header Content-Type "application/javascript; charset=utf-8";
                add_header Cross-Origin-Embedder-Policy "require-corp";
                add_header Cross-Origin-Opener-Policy "same-origin";
            }
        }

        # Assets estáticos con caché optimizado
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
            add_header Vary "Accept-Encoding";
            access_log off;
        }

        # Rutas de Laravel/Inertia
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
            expires 7d;
        }

        location = /robots.txt {
            access_log off;
            log_not_found off;
        }

        # PHP optimizado para Inertia.js con React 19
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;

            # Buffers grandes para respuestas JSON de Inertia
            fastcgi_buffer_size 64k;
            fastcgi_buffers 8 64k;
            fastcgi_busy_buffers_size 128k;
            fastcgi_temp_file_write_size 128k;

            # Timeouts extendidos
            fastcgi_connect_timeout 300s;
            fastcgi_send_timeout 300s;
            fastcgi_read_timeout 300s;

            include /etc/nginx/fastcgi_params;
        }

        # Protección de archivos sensibles
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ /(?:\.env|\.git|composer\.(lock|json)|package(-lock)?\.json|webpack\.|vite\.|node_modules/) {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
'''
