# Nixpacks config FINAL para Laravel + React

[phases.setup]
# Usamos PHP 8.3 para coincidir con el composer.lock del proyecto.
nixPkgs = [
    "php83",
    "php83Extensions.pdo_pgsql",
    "php83Extensions.bcmath",
    "php83Extensions.exif",
    "php83Extensions.gd",
    "php83Extensions.sockets",
    "php83Extensions.zip",
    "nginx",
    "php83Packages.composer",
    "nodejs_20",
    "python311Packages.supervisor"
]

[phases.build]
# Dejamos que Nixpacks haga la mayor parte del trabajo (composer install, npm install, npm run build).
# Solo preparamos los archivos de configuración de supervisor.
cmds = [
    "mkdir -p /etc/supervisor/conf.d/",
    "cp /assets/worker-*.conf /etc/supervisor/conf.d/",
    "cp /assets/supervisord.conf /etc/supervisord.conf",
    "chmod +x /assets/start.sh"
]

[start]
# El comando de inicio es lo único que necesitamos.
cmd = "/assets/start.sh"

[staticAssets]

# Script de arranque MÍNIMO y CONFIABLE.
"start.sh" = '''
#!/bin/bash
set -e

# 1. Generar la config de Nginx. La ruta /etc/nginx/nginx.conf es estándar en Nix.
node /assets/prestart.mjs /assets/nginx.template.conf /etc/nginx/nginx.conf

# 2. Iniciar Supervisor. Es la única tarea de este script.
echo "Starting supervisord..."
exec supervisord -c /etc/supervisord.conf -n
'''

# Script de pre-arranque sin cambios.
"prestart.mjs" = '''
import { readFileSync, writeFileSync } from 'fs';

const [templatePath, outputPath] = process.argv.slice(2);

if (!templatePath || !outputPath) {
  console.error('Usage: node prestart.mjs <template_path> <output_path>');
  process.exit(1);
}

try {
  let template = readFileSync(templatePath, 'utf8');
  const newContent = template.replace(/\$\{(\w+)\}/g, (_, varName) => {
    return process.env[varName] || '';
  });
  writeFileSync(outputPath, newContent);
  console.log(`Generated nginx config at ${outputPath}`);
} catch (error) {
  console.error(`Error processing nginx template: ${error.message}`);
  process.exit(1);
}
'''

# Config de Supervisor simplificada. No correr como root.
"supervisord.conf" = '''
[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
nodaemon=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
'''

# Worker de Nginx sin cambios.
"worker-nginx.conf" = '''
[program:nginx]
command=nginx -c /etc/nginx/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
'''

# Worker de PHP-FPM sin cambios.
"worker-phpfpm.conf" = '''
[program:php-fpm]
command=php-fpm -y /assets/php-fpm.conf -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
'''

# Worker de Laravel sin cambios.
"worker-laravel.conf" = '''
[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
startsecs=0
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
'''

# Config de PHP-FPM estándar y probada.
"php-fpm.conf" = '''
[global]
error_log = /proc/self/fd/2

[www]
listen = 127.0.0.1:9000
user = www-data
group = www-data
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 15
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

clear_env = no
catch_workers_output = yes

php_admin_value[post_max_size] = 35M
php_admin_value[upload_max_filesize] = 30M
'''

# Plantilla de Nginx estándar y probada.
"nginx.template.conf" = '''
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_names_hash_bucket_size 128;

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name _;

        root /app/public;
        index index.php;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        client_max_body_size 35M;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_buffer_size 8k;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include /etc/nginx/fastcgi_params;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
'''